<!doctype html><html lang="en"><head><meta charset="utf-8"><title>TaskBoard QA Demo</title>
<link rel="stylesheet" href="/style.css"></head><body>
<main><h1>TaskBoard QA Demo</h1><p>Local portfolio test application</p>
<section id="login-view"><h2>Sign in</h2><form id="login-form" novalidate>
<label for="username">Username</label><input id="username" autocomplete="username">
<label for="password">Password</label><input id="password" type="password" autocomplete="current-password">
<button id="login-button">Sign in</button></form><p id="login-error" role="alert"></p></section>
<section id="board-view" hidden><header><p id="welcome"></p><button id="logout-button">Log out</button></header>
<form id="task-form" novalidate><label for="task-title">Task title (1–70 characters)</label>
<input id="task-title"><button id="create-button">Create task</button></form><p id="task-error" role="alert"></p>
<label for="search">Search tasks</label><input id="search"><p id="empty-state">No tasks found.</p><ul id="task-list"></ul></section>
</main><script src="/app.js"></script></body></html>
